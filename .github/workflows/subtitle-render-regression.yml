name: Subtitle render regression

on:
  push:
    paths:
      - 'src/subtitle/**'
      - 'src/ui/components/SubtitleStep.tsx'
      - 'app/globals.css'
      - 'scripts/render-subtitle-preset-fixtures.ts'
      - '.github/workflows/subtitle-render-regression.yml'
  workflow_dispatch:

jobs:
  render-subtitle-presets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run test:subtitle-ass
      - run: npx tsx scripts/render-subtitle-preset-fixtures.ts artifacts/subtitle-presets
      - uses: actions/upload-artifact@v4
        with:
          name: subtitle-preset-renders
          path: artifacts/subtitle-presets
          if-no-files-found: error
          retention-days: 7
